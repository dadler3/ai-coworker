<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adler's Colleague Appreciation Engine™</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

.container {
    width: 100%;
    max-width: 800px;
}

.card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 28px;
    padding: 40px;
    text-align: center;
    color: white;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    font-size: 1.1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    max-width: 600px;
    margin: 0 auto 32px auto;
}

.input-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

input {
    flex: 1;
    min-width: 250px;
    max-width: 400px;
    padding: 16px 18px;
    border-radius: 14px;
    border: none;
    font-size: 18px;
    outline: none;
}

button {
    padding: 16px 24px;
    border: none;
    border-radius: 14px;
    background: white;
    color: #1e3a8a;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

button:active {
    transform: translateY(0);
}

.result {
    margin-top: 24px;
    min-height: 120px;
}

.quote-card {
    background: rgba(255,255,255,0.92);
    color: #111827;
    border-radius: 20px;
    padding: 28px;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: fadeIn 0.4s ease;
}

.quote-label {
    font-size: 12px;
    font-weight: 700;
    color: #2563eb;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.quote-text {
    font-size: 1.3rem;
    line-height: 1.7;
}

.footer {
    margin-top: 28px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 640px) {

    .card {
        padding: 28px 22px;
    }

    .input-row {
        flex-direction: column;
    }

    input,
    button {
        width: 100%;
        max-width: 100%;
    }

    .quote-text {
        font-size: 1.15rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Adler's Colleague Appreciation Engine™</h1>

        <p class="subtitle">
            Enter your name to receive a farewell message that Adler wrote just for you.
        </p>

        <div class="input-row">
            <input
                id="name"
                type="text"
                placeholder="Enter your name"
                onkeydown="if(event.key==='Enter') generate()">
            <button onclick="generate()">Generate</button>
        </div>

        <div id="result" class="result"></div>

        <div class="footer">
            Powered by years of workplace interactions and absolutely no artificial intelligence.
        </div>

    </div>
</div>

<script>

    "{name} consistently brought thoughtfulness, collaboration, and great energy to every interaction. Any team is lucky
