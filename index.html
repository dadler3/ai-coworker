<!DOCTYPE html>
<html>
<head>
    <title>Daniel's Colleague Appreciation Engine™</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }

        input {
            font-size: 18px;
            padding: 10px;
            width: 300px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            line-height: 1.5;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Adler's Colleague Appreciation Engine™</h1>
    <p>Enter your name to discover what Daniel was definitely going to say about you in his farewell Slack message.</p>

    <input id="name" placeholder="Your Name">
    <button onclick="generate()">Generate</button>

    <div id="result"></div>

    <script>
        const compliments = [
            "Working with {name} has been one of the absolute highlights of my time here. Their positivity, professionalism, and ability to make things happen are unmatched.",
            "{name} consistently brought thoughtfulness, collaboration, and great energy to every interaction. Any team is lucky to have them.",
            "I've always appreciated {name}'s willingness to help, solve problems, and somehow keep things moving forward even when things got chaotic.",
            "{name} has the rare combination of intelligence, kindness, and common sense. It has been a pleasure working together.",
            "Whether tackling big projects or everyday challenges, {name} always made work more enjoyable and successful.",
            "One thing I'll always remember about {name} is their ability to make everyone around them better.",
            "{name} is a true team player whose impact extends far beyond what most people realize.",
            "If there were a Hall of Fame for coworkers, {name} would receive strong consideration from the committee."
            "{name} has a unique ability to make complex situations feel manageable and challenging situations feel a little less challenging.",
            "Working with {name} always meant getting thoughtful perspectives, practical solutions, and occasional comic relief exactly when it was needed.",
            "{name} consistently raised the level of every discussion, meeting, and project they were involved in.",
            "I've always appreciated {name}'s willingness to jump in, help out, and make things better than they found them.",
            "{name} brought a combination of reliability, good judgment, and teamwork that everyone valued.",
            "Every organization needs people like {name}: smart, collaborative, and willing to do whatever needs to be done.",
            "One of the things I'll remember most about {name} is their steady presence and positive influence on those around them.",
            "{name} somehow found a way to improve outcomes while also making the process more enjoyable for everyone involved.",
            "Whether leading, supporting, or troubleshooting, {name} always seemed to make the team stronger.",
            "{name} has a knack for asking the right questions and helping people find the right answers.",
            "Working alongside {name} was a reminder that professionalism and kindness are not mutually exclusive.",
            "{name} consistently brought energy, perspective, and a willingness to tackle whatever came next.",
            "It's difficult to quantify the impact {name} has had, but it's safe to say it has been significant.",
            "Any project that included {name} was immediately more likely to succeed and considerably more pleasant to work on.",
            "{name} has earned the respect of colleagues through competence, integrity, and an uncanny ability to stay calm under pressure.",
            "Some coworkers contribute to projects. {name} contributed to people, teams, and culture as well.",
            "I always knew that if {name} was involved, things would end up in a better place than where they started.",
            "{name} made a lasting impact through a combination of expertise, generosity, and genuine care for others.",
            "Organizations spend years searching for teammates like {name}. Fortunately, we already had one.",
            "Working with {name} has been a genuine privilege and one of the many experiences I'll look back on fondly."
        ];

        function generate() {
            const name = document.getElementById("name").value.trim();

            if (!name) {
                document.getElementById("result").innerHTML =
                    "Please enter your name.";
                return;
            }

            const index = name.length % compliments.length;

            document.getElementById("result").innerHTML =
                compliments[index].replace("{name}", name);
        }
    </script>

</body>
</html>
