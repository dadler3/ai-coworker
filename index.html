<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adler's Colleague Appreciation Engine™</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

.container {
    width: 100%;
    max-width: 800px;
}

.card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 28px;
    padding: 40px;
    text-align: center;
    color: white;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    font-size: 1.1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    max-width: 600px;
    margin: 0 auto 32px auto;
}

.input-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

input {
    flex: 1;
    min-width: 250px;
    max-width: 400px;
    padding: 16px 18px;
    border-radius: 14px;
    border: none;
    font-size: 18px;
    outline: none;
}

button {
    padding: 16px 24px;
    border: none;
    border-radius: 14px;
    background: white;
    color: #1e3a8a;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.result {
    margin-top: 24px;
    min-height: 140px;
}

.quote-card {
    background: rgba(255,255,255,0.95);
    color: #111827;
    border-radius: 20px;
    padding: 28px;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.quote-label {
    font-size: 12px;
    font-weight: 700;
    color: #2563eb;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.quote-text {
    font-size: 1.25rem;
    line-height: 1.7;
}

.footer {
    margin-top: 30px;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
}

@media (max-width: 640px) {

    .card {
        padding: 28px 22px;
    }

    .input-row {
        flex-direction: column;
    }

    input,
    button {
        width: 100%;
        max-width: 100%;
    }

    .quote-text {
        font-size: 1.1rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Adler's Colleague Appreciation Engine™</h1>

        <p class="subtitle">
            Enter your name to receive a farewell message that Adler wrote just for you.
        </p>

        <div class="input-row">
            <input
                id="name"
                type="text"
                placeholder="Your Name"
                onkeypress="if(event.key==='Enter') generate();">
            <button onclick="generate()">Generate</button>
        </div>

        <div id="result" class="result"></div>

        <div class="footer">
            Powered by years of workplace interactions and absolutely no artificial intelligence.
        </div>

    </div>
</div>

<script>

const compliments = [
    "Working with {name} has been one of the absolute highlights of my time here. Their positivity, professionalism, and ability to make things happen are unmatched.",
    "{name} consistently brought thoughtfulness, collaboration, and great energy to every interaction. Any team is lucky to have them.",
    "I've always appreciated {name}'s willingness to help, solve problems, and somehow keep things moving forward even when things got chaotic.",
    "{name} has the rare combination of intelligence, kindness, and common sense. It has been a pleasure working together.",
    "Whether tackling big projects or everyday challenges, {name} always made work more enjoyable and successful.",
    "One thing I'll always remember about {name} is their ability to make everyone around them better.",
    "{name} is a true team player whose impact extends far beyond what most people realize.",
    "If there were a Hall of Fame for coworkers, {name} would receive strong consideration from the committee.",
    "{name} has a unique ability to make complex situations feel manageable and challenging situations feel a little less challenging.",
    "Working with {name} always meant getting thoughtful perspectives, practical solutions, and occasional comic relief exactly when it was needed.",
    "{name} consistently raised the level of every discussion, meeting, and project they were involved in.",
    "I've always appreciated {name}'s willingness to jump in, help out, and make things better than they found them.",
    "{name} brought a combination of reliability, good judgment, and teamwork that everyone valued.",
    "Every organization needs people like {name}: smart, collaborative, and willing to do whatever needs to be done.",
    "One of the things I'll remember most about {name} is their steady presence and positive influence on those around them.",
    "{name} somehow found a way to improve outcomes while also making the process more enjoyable for everyone involved.",
    "Whether leading, supporting, or troubleshooting, {name} always seemed to make the team stronger.",
    "{name} has a knack for asking the right questions and helping people find the right answers.",
    "Working alongside {name} was a reminder that professionalism and kindness are not mutually exclusive.",
    "{name} consistently brought energy, perspective, and a willingness to tackle whatever came next.",
    "It's difficult to quantify the impact {name} has had, but it's safe to say it has been significant.",
    "Any project that included {name} was immediately more likely to succeed and considerably more pleasant to work on.",
    "{name} has earned the respect of colleagues through competence, integrity, and an uncanny ability to stay calm under pressure.",
    "Some coworkers contribute to projects. {name} contributed to people, teams, and culture as well.",
    "I always knew that if {name} was involved, things would end up in a better place than where they started.",
    "{name} made a lasting impact through a combination of expertise, generosity, and genuine care for others.",
    "Organizations spend years searching for teammates like {name}. Fortunately, we already had one.",
    "Working with {name} has been a genuine privilege and one of the many experiences I'll look back on fondly.",
    "{name} has been selected for Platinum Coworker status. This designation has absolutely no benefits but sounds impressive.",
    "After extensive analysis, our model has determined that {name} is above replacement coworker.",
    "{name} received a coworker WAR rating that rounds favorably and therefore will not be discussed further.",
    "The algorithm rated {name} as 'Strongly Recommended for Future Team Projects.'",
    "The data indicates that meetings were, on average, 14% better when {name} attended. Methodology unavailable upon request."
];

let lastIndex = -1;

function generate() {

    const name = document.getElementById("name").value.trim();

    if (name === "") {
        document.getElementById("result").innerHTML =
            '<div class="quote-card">' +
            '<div class="quote-text">Please enter your name.</div>' +
            '</div>';
        return;
    }

    let randomIndex;

    do {
        randomIndex = Math.floor(Math.random() * compliments.length);
    } while (compliments.length > 1 && randomIndex === lastIndex);

    lastIndex = randomIndex;

    const message =
        compliments[randomIndex].replace("{name}", name);

    document.getElementById("result").innerHTML =
        '<div class="quote-card">' +
        '<div class="quote-label">Official Farewell Message</div>' +
        '<div class="quote-text">' + message + '</div>' +
        '</div>';
}

</script>

</body>
</html>
